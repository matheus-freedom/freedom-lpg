[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Função leve (translate, audio) — limite padrão de 26s é suficiente
[functions.gemini]
  timeout = 26

# Background function — sem limite de tempo fixo (até 15 minutos)
# Não precisa de timeout aqui pois background functions são assíncronas
[functions.gemini-background]
  timeout = 900

# Inspirações semanais — dispara a background function todo domingo
# às 21:00 UTC (= 18:00 em Brasília; o Brasil não tem horário de verão).
# Cron é sempre avaliado em UTC pela Netlify.
[functions.inspirations-weekly]
  schedule = "0 21 * * 0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
